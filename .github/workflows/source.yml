name: Comment Source Updater

on:
  issue_comment:
    types: [created, edited]

jobs:
  update-source:
    runs-on: ubuntu-latest
    # 严格限制：仅在 Issue #1 中触发
    if: github.event.issue.number == 1
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Path and Update .source
        id: validate
        shell: bash
        run: |
          # 1. 提取评论内容（去除前后空格）
          INPUT_PATH=$(echo "${{ github.event.comment.body }}" | xargs)
          
          # 2. 检查路径是否存在
          if [ -e "$INPUT_PATH" ]; then
            SOURCE_DIR="$INPUT_PATH"
            
            # 如果输入是文件，取其所在目录
            if [ -f "$SOURCE_DIR" ]; then
              SOURCE_DIR=$(dirname "$SOURCE_DIR")
            fi
            
            # 3. 检查目录下是否有 I18n*.json 文件
            # 使用 find 确保即使有多个匹配也能通过
            if ls "$SOURCE_DIR"/I18n*.json 1> /dev/null 2>&1; then
              echo "Valid path: $SOURCE_DIR"
              
              # 写入文件
              echo "$SOURCE_DIR" > .source
              
              # 输出变量供后续 commit 使用
              echo "final_path=$SOURCE_DIR" >> $GITHUB_OUTPUT
              echo "confirmed=true" >> $GITHUB_OUTPUT
            else
              echo "::error::No I18n*.json files found in $SOURCE_DIR"
              exit 1
            fi
          else
            echo "::error::Path '$INPUT_PATH' does not exist in the repository."
            exit 1
          fi

      - name: Commit and Push .source
        if: steps.validate.outputs.confirmed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          git add .source
          
          # 只有内容发生变化时才提交
          if ! git diff --cached --quiet; then
            git commit -m "chore: update .source to ${{ steps.validate.outputs.final_path }}"
            git push
          else
            echo "No changes in .source, skipping push."
          fi
