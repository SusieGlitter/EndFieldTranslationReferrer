name: Comment Source Updater

on:
  issue_comment:
    types: [created, edited]

jobs:
  update-source:
    runs-on: ubuntu-latest
    if: github.event.issue.number == 1
    
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Repo and Path
        id: extract
        shell: bash
        run: |
          RAW_INPUT=$(echo "${{ github.event.comment.body }}" | xargs)
          
          if [[ "$RAW_INPUT" == *"github.com"* ]]; then
            REPO_FULL=$(echo "$RAW_INPUT" | sed -E 's|.*github.com/([^/]+/[^/]+)/.*|\1|')
            SUB_PATH=$(echo "$RAW_INPUT" | sed -E 's|.*/tree/[^/]+/(.*)|\1|')
            FINAL_STR="${REPO_FULL}/${SUB_PATH}"
          else
            FINAL_STR="$RAW_INPUT"
          fi

          echo "$FINAL_STR" > .source
          echo "final_value=$FINAL_STR" >> $GITHUB_OUTPUT

      - name: Commit and Push
        id: commit_step
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          git add .source
          
          if ! git diff --cached --quiet; then
            git commit -m "chore: update source to ${{ steps.extract.outputs.final_value }}"
            git push
            # 获取最新的 commit hash
            echo "commit_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
            echo "pushed=true" >> $GITHUB_OUTPUT
          else
            echo "pushed=false" >> $GITHUB_OUTPUT
            echo "No change detected."
          fi

      - name: Reply to Comment
        if: steps.commit_step.outputs.pushed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const commitSha = '${{ steps.commit_step.outputs.commit_sha }}';
            const runId = context.runId;
            const repoUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}`;
            
            const commitLink = `${repoUrl}/commit/${commitSha}`;
            const actionLink = `${repoUrl}/actions/runs/${runId}`;
            
            const body = `✅ **Source 已更新**\n\n` +
                         `- **新路径**: \`${{ steps.extract.outputs.final_value }}\`\n` +
                         `- **Commit 链接**: [${commitSha.substring(0, 7)}](${commitLink})\n` +
                         `- **Action 运行记录**: [点击查看](${actionLink})`;
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
