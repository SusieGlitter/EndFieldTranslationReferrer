name: Comment Source Updater

on:
  issue_comment:
    types: [created, edited]

jobs:
  update-source:
    runs-on: ubuntu-latest
    if: github.event.issue.number == 1
    
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_PAT }}

      - name: Extract Repo and Path
        id: extract
        shell: bash
        run: |
          RAW_INPUT=$(echo "${{ github.event.comment.body }}" | xargs)
          if [[ "$RAW_INPUT" == *"github.com"* ]]; then
            REPO_FULL=$(echo "$RAW_INPUT" | sed -E 's|.*github.com/([^/]+/[^/]+)/.*|\1|')
            SUB_PATH=$(echo "$RAW_INPUT" | sed -E 's|.*/tree/[^/]+/(.*)|\1|')
            FINAL_STR="${REPO_FULL}/${SUB_PATH}"
          else
            FINAL_STR="$RAW_INPUT"
          fi
          echo "$FINAL_STR" > .source
          echo "final_value=$FINAL_STR" >> $GITHUB_OUTPUT

      - name: Commit and Push
        id: commit_step
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "github-actions[bot]"
          git add .source
          if ! git diff --cached --quiet; then
            git commit -m "chore: update source to ${{ steps.extract.outputs.final_value }}"
            git push
            echo "commit_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
            echo "pushed=true" >> $GITHUB_OUTPUT
          else
            echo "pushed=false" >> $GITHUB_OUTPUT
          fi

      - name: Reply to Comment
        if: steps.commit_step.outputs.pushed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ steps.commit_step.outputs.commit_sha }}';
            const val = '${{ steps.extract.outputs.final_value }}';
            const run = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${context.runId}`;
            const cLink = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/commit/${sha}`;
            
            let body = "### 🚀 资源同步配置已成功更新\n\n";
            body += "| 属性 | 内容 |\n| :--- | :--- |\n";
            body += `| **状态** | 🟢 已就绪 |\n`;
            body += `| **数据源** | \`${val}\` |\n`;
            body += `| **提交** | [\`${sha.substring(0, 7)}\`](${cLink}) |\n`;
            body += `| **日志** | [查看流水线 ↗️](${run}) |\n\n`;
            body += "---\n> **💡 提示**: 同步任务已自动触发。\n\n";
            body += "<details><summary>🛠 运行详情</summary>\n\n";
            body += `- 触发用户: @${context.payload.comment.user.login}\n`;
            body += `- 运行编号: ${context.runId}\n</details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
