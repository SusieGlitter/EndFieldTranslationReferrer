name: Sync i18n Folder

on:
  schedule:
    - cron: '0 0 * * *' # 每天北京时间上午 8 点运行
  workflow_dispatch:   # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest  # 这里已修正
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Clone source repo
        run: |
          git clone --depth 1 https://github.com/XiaBei-cy/EndfieldData.git source_repo

      - name: Copy i18n folder
        run: |
          # 如果你原来的 i18n 文件夹里有嵌套，这里会直接覆盖它
          mkdir -p i18n
          cp -r source_repo/i18n/* ./i18n/
          rm -rf source_repo

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add i18n/
          # 检查是否有文件变更，避免无意义的提交报错
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: sync i18n folder from XiaBei-cy/EndfieldData"
            git push
          else
            echo "No changes to commit"
          fi
