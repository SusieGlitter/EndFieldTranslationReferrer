name: Sync i18n Folder

on:
  schedule:
    - cron: '0 0 * * *' # 每天北京时间上午 8 点自动运行
  workflow_dispatch: # 允许手动运行

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Current Repo
        uses: actions/checkout@v4
        with:
          # 获取整个仓库以运行本地的 apply_hotfix.py
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Resolve Latest AKEDatabase Version
        id: resolve_version
        run: |
          MANIFEST_URL="https://data.akedata.wiki/manifest.json"
          MANIFEST=$(curl --fail --retry 3 --silent --show-error "$MANIFEST_URL")
          LATEST_ID=$(echo "$MANIFEST" | jq -r '.latest')
          TABLE_CFG_PATH=$(echo "$MANIFEST" | jq -r --arg latest "$LATEST_ID" \
            '.versions[] | select(.id == $latest) | .tableCfgPath')

          if [ -z "$LATEST_ID" ] || [ "$LATEST_ID" = "null" ] ||
             [ -z "$TABLE_CFG_PATH" ] || [ "$TABLE_CFG_PATH" = "null" ]; then
            echo "::error::Unable to resolve the latest AKEDatabase TableCfg version."
            exit 1
          fi

          echo "Resolved AKEDatabase version: $LATEST_ID"
          echo "TableCfg path: $TABLE_CFG_PATH"
          echo "version=$LATEST_ID" >> "$GITHUB_OUTPUT"
          echo "table_cfg_path=$TABLE_CFG_PATH" >> "$GITHUB_OUTPUT"

      - name: Update i18n Folder
        run: |
          rm -rf i18n
          mkdir -p i18n

          BASE_URL="https://data.akedata.wiki/${{ steps.resolve_version.outputs.table_cfg_path }}"
          LANGUAGES="BR CN DE EN FR ID IT JP KR MX RU TC TH VN"
          for language in $LANGUAGES; do
            filename="I18nTextTable_${language}.json"
            echo "Downloading $filename"
            curl --fail --retry 3 --silent --show-error \
              --location "$BASE_URL/$filename" \
              --output "i18n/$filename"
          done

          for filename in I18nHotFix.json I18nTextServerTimeIdTable.json; do
            echo "Downloading $filename"
            curl --fail --retry 3 --silent --show-error \
              --location "$BASE_URL/$filename" \
              --output "i18n/$filename"
          done

          test "$(find i18n -maxdepth 1 -type f -name 'I18n*.json' | wc -l)" -eq 16

      - name: Run Hotfix Script
        run: |
          # 确保环境中有 Python（Ubuntu runner 默认自带）
          # 运行本地仓库中的 apply_hotfix.py
          if [ -f "apply_hotfix.py" ]; then
            python3 apply_hotfix.py
          else
            echo "::error::apply_hotfix.py not found in root directory!"
            exit 1
          fi

      - name: Commit and Push All Changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          git add i18n/ data/
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: sync i18n from AKEDatabase ${{ steps.resolve_version.outputs.version }}"
            git push
          else
            echo "No changes detected after sync and hotfix."
          fi
