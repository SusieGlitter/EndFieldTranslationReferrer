name: Sync i18n Folder

on:
  schedule:
    - cron: '0 0 * * *' # 每天北京时间上午 8 点自动运行
  workflow_dispatch:   # 允许你在 GitHub 页面手动点击运行

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clone source repo
        run: |
          git clone --depth 1 https://github.com/rmxlinux/EndfieldData.git source_repo

      - name: Copy I18n JSON files
        run: |
          # 确保目标文件夹存在
          mkdir -p i18n
          # 只拷贝 source_repo/TableCfg 中以 I18n 开头的 JSON 文件
          find source_repo/TableCfg -maxdepth 1 -type f -name 'I18n*.json' -exec cp -f {} ./i18n/ \;
          # 删除临时克隆的目录
          rm -rf source_repo

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add i18n/
          # 只有在有变动时才提交，防止报错
          git diff-index --quiet HEAD || git commit -m "chore: sync i18n folder from XiaBei-cy/EndfieldData"
          git push
