name: Sync and Apply Hotfix

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync_and_process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4

      - name: Clone source repo
        run: |
          git clone --depth 1 https://github.com/XiaBei-cy/EndfieldData.git source_repo

      - name: Sync i18n folder
        run: |
          mkdir -p i18n
          cp -r source_repo/i18n/* ./i18n/
          rm -rf source_repo

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Apply Hotfix Script
        run: python apply_hotfix.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 提交 i18n (原始数据) 和 data (处理后的数据)
          git add i18n/ data/
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: sync data and apply hotfixes"
            git push
          else
            echo "No changes detected."
          fi
