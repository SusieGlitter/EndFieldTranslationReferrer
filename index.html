<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endfield 翻译查询工具</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.js"></script>
    <style>
        :root {
            --primary-color: #409eff;
            --bg-color: #1a1b1e;
            --card-bg: #25262b;
            --text-main: #c1c2c5;
            --text-bright: #ffffff;
            --border-color: #373a40;
            --highlight-bg: #e67e22;
            --footer-text: #5c5f66;
        }

        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding: 20px;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container { 
            max-width: 1100px; 
            margin: 0 auto; 
            flex: 1;
            width: 100%;
        }

        header { text-align: center; margin-bottom: 30px; }
        h1 { color: var(--text-bright); margin-bottom: 5px; font-weight: 300; }
        .subtitle { color: #5c5f66; font-size: 0.9em; }

        .config-card { 
            background: var(--card-bg); 
            border: 1px solid var(--border-color);
            padding: 20px; 
            border-radius: 12px; 
            margin-bottom: 25px;
        }

        .config-row { display: flex; align-items: flex-start; margin-bottom: 15px; }
        .config-label { width: 100px; font-weight: bold; color: var(--primary-color); padding-top: 5px; }

        select {
            background: #2c2e33; color: white; border: 1px solid var(--border-color);
            padding: 8px 12px; border-radius: 6px; outline: none;
        }

        .checkbox-group { display: flex; flex-wrap: wrap; gap: 8px; }
        .checkbox-item { 
            display: flex; align-items: center; 
            background: #2c2e33; border: 1px solid var(--border-color); 
            padding: 6px 12px; border-radius: 20px; 
            cursor: pointer; transition: 0.2s; font-size: 0.85em;
        }
        .checkbox-item:hover { border-color: var(--primary-color); }
        .checkbox-item.active { background: var(--primary-color); color: white; border-color: var(--primary-color); }
        .checkbox-item.disabled { opacity: 0.3; cursor: not-allowed; }
        .checkbox-item input { display: none; }

        .search-box { 
            width: 100%; padding: 18px; font-size: 18px; 
            background: var(--card-bg); border: 2px solid var(--border-color); 
            border-radius: 12px; color: white; outline: none;
            transition: 0.3s; box-sizing: border-box;
        }
        .search-box:focus { border-color: var(--primary-color); box-shadow: 0 0 0 4px rgba(64, 158, 255, 0.1); }

        .result-item { 
            background: var(--card-bg); border: 1px solid var(--border-color); 
            margin-bottom: 15px; border-radius: 12px; overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .result-item:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.3); }

        .result-header { padding: 20px; display: flex; align-items: center; cursor: pointer; }
        .result-id { font-family: 'JetBrains Mono', monospace; color: #5c5f66; font-size: 0.8em; min-width: 180px; }
        .result-preview { flex-grow: 1; padding: 0 20px; color: var(--text-bright); border-left: 2px solid var(--border-color); }

        .detail-panel { 
            padding: 0 20px 20px; border-top: 1px solid var(--border-color);
            background: rgba(0,0,0,0.1);
        }
        .lang-row { display: flex; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .lang-tag { width: 140px; color: var(--primary-color); font-size: 0.8em; font-weight: bold; flex-shrink: 0; }
        .lang-val { flex-grow: 1; color: var(--text-main); font-size: 0.95em; white-space: pre-wrap; }

        .highlight { background: var(--highlight-bg); color: white; border-radius: 3px; padding: 0 4px; }
        .status { text-align: center; padding: 40px; color: #5c5f66; }

        /* 加载更多按钮 */
        .load-more-btn {
            display: block; width: 200px; margin: 20px auto; padding: 12px;
            background: transparent; border: 1px solid var(--primary-color);
            color: var(--primary-color); border-radius: 8px; cursor: pointer;
            transition: all 0.3s; font-size: 14px;
        }
        .load-more-btn:hover { background: var(--primary-color); color: white; }

        footer {
            margin-top: 50px; padding: 30px 20px; border-top: 1px solid var(--border-color);
            text-align: center; font-size: 0.85em; color: var(--footer-text);
        }
        .footer-links { display: flex; justify-content: center; gap: 20px; margin-top: 10px; }
        .footer-links a { color: var(--text-main); text-decoration: none; transition: color 0.2s; display: flex; align-items: center; gap: 5px; }
        .footer-links a:hover { color: var(--primary-color); }

        [v-cloak] { display: none; }
    </style>
</head>
<body>

<div id="app" v-cloak class="container">
    <header>
        <h1>Endfield Translation Referrer</h1>
        <div class="subtitle">终端翻译参考工具 · 数据自动同步</div>
    </header>

    <div class="config-card">
        <div class="config-row">
            <div class="config-label">源语言</div>
            <select v-model="sourceLang" @change="refreshSearch">
                <option v-for="l in allLangs" :key="l.code" :value="l.code">{{ l.name }} ({{ l.code }})</option>
            </select>
        </div>
        <div class="config-row">
            <div class="config-label">对照语言</div>
            <div class="checkbox-group">
                <label v-for="l in allLangs" :key="l.code" 
                       class="checkbox-item" 
                       :class="{ active: targetLangs.includes(l.code), disabled: l.code === sourceLang }">
                    <input type="checkbox" :value="l.code" v-model="targetLangs" :disabled="l.code === sourceLang">
                    {{ l.name }} ({{ l.code }})
                </label>
            </div>
        </div>
    </div>

    <input type="text" class="search-box" v-model="query" placeholder="键入关键词进行搜索..." @input="onInput">

    <div v-if="loading" class="status">⏳ 正在同步翻译数据中...</div>
    <div v-if="!loading && query && filteredResults.length === 0" class="status">未找到匹配的结果</div>

    <div class="results">
        <div v-for="(item, index) in visibleResults" :key="item.id" class="result-item">
            <div class="result-header" @click="toggleExpand(item.id)">
                <span class="result-id">{{ item.id }}</span>
                <span class="result-preview" v-html="highlightText(item.text)"></span>
                <span style="font-size: 0.8em;">{{ expandedIds.has(item.id) ? '▲' : '▼' }}</span>
            </div>
            
            <div v-if="expandedIds.has(item.id)" class="detail-panel">
                <div class="lang-row" style="background: rgba(64, 158, 255, 0.05);">
                    <div class="lang-tag">{{ getLangName(sourceLang) }}</div>
                    <div class="lang-val" style="color: var(--text-bright)">{{ item.text }}</div>
                </div>
                <div v-for="code in targetLangs" :key="code" class="lang-row">
                    <div class="lang-tag">{{ getLangName(code) }}</div>
                    <div class="lang-val">{{ getTranslation(code, item.id) }}</div>
                </div>
            </div>
        </div>

        <button v-if="hasMore" class="load-more-btn" @click="loadMore">
            显示更多结果 (当前已显示 {{ visibleCount }} 条)
        </button>
    </div>
</div>

<footer>
    <div>Endfield Translation Referrer Project</div>
    <div class="footer-links">
        <a href="https://github.com/SusieGlitter/EndFieldTranslationReferrer" target="_blank">📂 本项目仓库</a>
        <a href="https://github.com/XiaBei-cy/EndfieldData/tree/master/i18n" target="_blank">💾 数据源地址</a>
    </div>
</footer>

<script>
const { createApp, ref, computed, onMounted } = Vue;

createApp({
    setup() {
        const NAME_ID = "-4343576784152848542";
        const LANG_CODES = ['CN', 'TC', 'EN', 'JP', 'KR', 'DE', 'FR', 'RU', 'MX', 'BR', 'IT', 'ID', 'TH', 'VN'];
        
        const allLangs = ref([]);
        const sourceLang = ref('CN');
        const targetLangs = ref(['TC', 'EN', 'JP', 'KR']);
        const query = ref('');
        const dataCache = ref({});
        const loading = ref(false);
        const filteredResults = ref([]); // 存储所有搜索命中的结果
        const visibleCount = ref(10);    // 当前可见的数量
        const expandedIds = ref(new Set());

        // 计算属性：真正渲染到页面的结果
        const visibleResults = computed(() => {
            return filteredResults.value.slice(0, visibleCount.value);
        });

        // 是否还有更多可以加载
        const hasMore = computed(() => {
            return visibleCount.value < filteredResults.value.length;
        });

        const init = async () => {
            loading.value = true;
            for (const code of LANG_CODES) {
                try {
                    const res = await fetch(`./data/I18nTextTable_${code}.json`);
                    if (res.ok) {
                        const data = await res.json();
                        dataCache.value[code] = data;
                        allLangs.value.push({ code, name: data[NAME_ID] || code });
                    }
                } catch (e) {}
            }
            loading.value = false;
        };

        const onInput = () => {
            clearTimeout(window.t);
            window.t = setTimeout(search, 300);
        };

        const search = () => {
            const q = query.value.trim().toLowerCase();
            if (!q) {
                filteredResults.value = [];
                visibleCount.value = 10;
                expandedIds.value.clear();
                return;
            }

            const sourceData = dataCache.value[sourceLang.value];
            if (!sourceData) return;

            const matches = [];
            for (const [id, text] of Object.entries(sourceData)) {
                if (id === NAME_ID) continue;
                if (String(text).toLowerCase().includes(q)) {
                    matches.push({ id, text: String(text) });
                }
            }

            filteredResults.value = matches.sort((a, b) => a.text.length - b.text.length);
            visibleCount.value = 10; // 每次新搜索重置为 10
            
            expandedIds.value.clear();
            if (filteredResults.value.length > 0) {
                expandedIds.value.add(filteredResults.value[0].id);
            }
        };

        const loadMore = () => {
            visibleCount.value += 20; // 每次点击增加 20 条
        };

        const toggleExpand = (id) => {
            expandedIds.value.has(id) ? expandedIds.value.delete(id) : expandedIds.value.add(id);
        };

        const getTranslation = (code, id) => dataCache.value[code]?.[id] || "---";
        const getLangName = (code) => {
            const l = allLangs.value.find(x => x.code === code);
            return l ? `${l.name} (${code})` : code;
        };

        const highlightText = (text) => {
            if (!query.value) return text;
            const escaped = query.value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            return text.replace(new RegExp(`(${escaped})`, 'gi'), '<span class="highlight">$1</span>');
        };

        const refreshSearch = () => {
            targetLangs.value = targetLangs.value.filter(t => t !== sourceLang.value);
            search();
        };

        onMounted(init);

        return {
            allLangs, sourceLang, targetLangs, query, loading, filteredResults, expandedIds,
            visibleCount, visibleResults, hasMore, loadMore,
            onInput, toggleExpand, getTranslation, getLangName, highlightText, refreshSearch
        };
    }
}).mount('#app');
</script>
</body>
</html>
